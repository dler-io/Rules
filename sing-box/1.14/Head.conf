  "log": {
    "level": "error",
    "timestamp": true
  },
  "experimental": {
    "cache_file": {
      "enabled": true,
      "store_fakeip": false,
      "store_dns": true
    },
    "clash_api": {
      "external_controller": "127.0.0.1:9090",
      "external_ui": "ui",
      "external_ui_download_url": "https://github.com/Zephyruso/zashboard/releases/latest/download/dist-no-fonts.zip",
      "default_mode": "Rule"
    }
  },
  "dns": {
    "servers": [
      {
        "type": "tls",
        "server": "8.8.8.8",
        "tag": "dns_proxy",
        "detour": "Proxy"
      },
      {
        "type": "udp",
        "server": "223.5.5.5",
        "tag": "dns_direct"
      }
    ],
    "rules": [
      {
        "clash_mode": "Direct",
        "server": "dns_direct"
      },
      {
        "clash_mode": "Proxy",
        "server": "dns_proxy"
      },
      {
        "rule_set": "geosite-cn",
        "server": "dns_direct"
      },
      {
        "rule_set": "geolocation-!cn",
        "invert": true,
        "action": "evaluate",
        "server": "dns_proxy",
        "tag": "regional",
        "client_subnet": "114.114.114.0/24"
      },
      {
        "match_response": "regional",
        "rule_set": "geoip-cn",
        "action": "respond"
      }
    ],
    "strategy": "prefer_ipv4",
    "final": "dns_proxy"
  },
  "inbounds": [
    {
      "type": "tun",
      "address": [
        "172.19.0.1/30",
        "fdfe:dcba:9876::1/126"
      ],
      "auto_route": true,
      "strict_route": true
    },
    {
      "type": "mixed",
      "listen": "::",
      "listen_port": 7890
    }
  ],
  "http_clients": [
    {
      "tag": "rule_download",
      "detour": "Proxy"
    }
  ],
