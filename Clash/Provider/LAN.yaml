  # > LAN
  # No no-resolve: domains whose records point at these ranges must match here.
  - DOMAIN-SUFFIX,local
  - IP-CIDR,10.0.0.0/8
  - IP-CIDR,100.64.0.0/10
  - IP-CIDR,127.0.0.0/8
  - IP-CIDR,172.16.0.0/12
  - IP-CIDR,192.168.0.0/16
  - IP-CIDR6,::1/128
  - IP-CIDR6,fc00::/7
  - IP-CIDR6,fe80::/10
